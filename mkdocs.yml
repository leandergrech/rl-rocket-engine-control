site_name: RL for rocket engine control
site_description: A personal literature review and codebase for deep-RL control of liquid-propellant rocket engines, anchored on DLR's LUMEN Control Challenge
site_author: Leander Grech
site_url: https://leandergrech.github.io/rl-rocket-engine-control/
repo_url: https://github.com/leandergrech/rl-rocket-engine-control
repo_name: leandergrech/rl-rocket-engine-control
edit_uri: edit/main/docs/

theme:
  name: material
  custom_dir: overrides
  logo: assets/logo.svg
  favicon: assets/logo.svg
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.sections
    - navigation.top
    - toc.follow
    - toc.integrate
    - content.code.copy
    - search.highlight
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

exclude_docs: |
  email-to-dlr.md

nav:
  - Overview:
      - Home: index.md
      - For Leander: for-leander.md
  - The benchmark:
      - The control problem: 01-problem.md
      - Designs and results: 04-designs.md
      - Baselines on the surrogate: 04a-surrogate-baselines.md
      - Limitations: 05-limitations.md
      - Open questions: 06-open-questions.md
  - Domain primer:
      - Start here: 02-primer.md
      - The engine as a control system: primer/1-engine.md
      - The expander-bleed cycle: primer/2-cycle.md
      - Valves are the actuators: primer/3-valves.md
      - Fast chamber, slow heat: primer/4-time-scales.md
      - Constraints and the operating map: primer/5-constraints.md
      - Sensors, delays and noise: primer/6-sensors.md
      - From physics to reward: primer/7-reward.md
      - The Engine Lab: primer/8-lab.md
      - Hot fire, simulators and glossary: primer/9-field.md
  - Reference:
      - Equation sheet: primer/equations.md
      - Timeline 2018–2026: 03-timeline.md
      - References: 07-references.md

hooks:
  - hooks/asset_versions.py

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
      options:
        custom_icons:
          - overrides/.icons
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
        - name: vegalite
          class: vegalite
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_css:
  - stylesheets/base.css
  - stylesheets/theme.css

extra_javascript:
  - javascripts/lumen-model.js
  - javascripts/widgets.js
  - javascripts/teststand.js
  - javascripts/lab.js
  - javascripts/nav.js
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
  - https://cdn.jsdelivr.net/npm/vega@6.4.0/build/vega.min.js
  - https://cdn.jsdelivr.net/npm/vega-lite@6.4.3/build/vega-lite.min.js
  - https://cdn.jsdelivr.net/npm/vega-embed@7.3.0/build/vega-embed.min.js
  - javascripts/charts.js
