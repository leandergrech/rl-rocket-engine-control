[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rl_rocket_engine"
version = "0.0.1"
description = "Deep-RL control of liquid-propellant rocket engines, anchored on DLR's LUMEN Control Challenge"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Leander Grech"}]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "gymnasium>=0.29",
]

[project.optional-dependencies]
# PPO/SAC baselines. On CPU-only machines install torch from https://download.pytorch.org/whl/cpu first.
rl = [
    "torch>=2.2",
    "stable-baselines3>=2.3",
]
dev = [
    "pytest>=7",
    "mkdocs>=1.6,<2",
    "pyyaml>=6",
    "mkdocs-material>=9.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rl_rocket_engine = ["surrogate/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
